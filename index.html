<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiTienda POS — la caja para tu tienda</title>
    <!--
      Meta estáticos: este index.html se sirve para TODAS las rutas del SPA
      (ver public/_redirects), así que describen la landing de la raíz. Sin SSR
      no hay forma de variarlos por ruta, y los crawlers sociales no ejecutan JS:
      sin esto, compartir el enlace sale en blanco.
    -->
    <meta
      name="description"
      content="MiTienda POS: caja, inventario y facturación electrónica SUNAT en un solo equipo, con el stock sincronizado con tu tienda online. Web y Android."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MiTienda POS" />
    <meta property="og:title" content="MiTienda POS — la caja para tu tienda" />
    <meta
      property="og:description"
      content="MiTienda POS: caja, inventario y facturación electrónica SUNAT en un solo equipo, con el stock sincronizado con tu tienda online. Web y Android."
    />
    <meta property="og:url" content="https://pos.mitienda.pe/" />
    <meta property="og:image" content="https://pos.mitienda.pe/img/pos-banner.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      La raíz es la landing del producto y sí debe indexar. Como _redirects sirve
      este mismo HTML para TODAS las rutas, el canonical apunta siempre a / para
      que las rutas internas de la app (/pos, /inventory…) no compitan con ella
      como duplicados.
    -->
    <link rel="canonical" href="https://pos.mitienda.pe/" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7JXW2GGFX1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7JXW2GGFX1');
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
